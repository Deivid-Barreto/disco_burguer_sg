<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="">
</head>
<body>
<header>

<a href="">Voltar</a>

</header>


<div>
<form method="POST" enctype="multipart/form-data">

<label>Nome:</label>
<input type="text" name="nome" required value="?=$l['nome']?">

<label>Categoria</label>
<select name="categoria_id" required>
    <option value="1">Burguers</option>
    <option value="2">Combos</option>
    <option value="3">Shakes</option>
    <option value="4">Bebidas</option>
    <option value="5">Porções</option>
</select>

<label>Descrição</label>
<textarea name="descricao"><?=$l['descricao']?></textarea>

<label>Preço</label>
<input type="number" id="preco_venda" name="preco_venda" min="0" step="0.01" placeholder="0,00"
 required value="?=$l['preco_venda']?">

<label>Foto:</label>
<input type="file" name="imagemcaminho">

<label>Mostrar no Cardápio:</label>

<input type="radio" id="sim" name="mostrar_no_cardapio" value="1" required>
<label for="sim">Sim</label><br>

<input type="radio" id="nao" name="mostrar_no_cardapio" value="0">
<label for="nao">Não</label><br>
    
<button>Atualizar</button>

<button>Excluir</button>

</form>
</div>
</body>
</html>
