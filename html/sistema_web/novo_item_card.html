<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        
<div class="container">

<h2>Cadastro de novo item</h2>

<form method="POST">

<label>Nome</label>
<input type="nome" name="nome" required>

<label>Categoria ID</label>
<input type="number" name="categ_id" required>

<label>Descrição</label>
<textarea id="descricao" name="descricao" rows="5" cols="40" required></textarea>

<label>Preço</label>
<input type="number" id="preco" name="preco" min="0" step="0.01" placeholder="0,00" required>

<label>Mostrar no Cardápio:</label>

<input type="radio" id="sim" name="opcao" value=Sim">
<label for="sim">Sim</label><br>

<input type="radio" id="nao" name="opcao" value="Não">
<label for="nao">Não</label><br>

<button>Entrar</button>
</form>
</div>
</body>
</html>
