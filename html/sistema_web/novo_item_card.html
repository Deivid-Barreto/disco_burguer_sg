<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        
<div class="container">


<h2>Cadastro de novo produto</h2>

<form method="POST">

<label for="revenda">Revenda</label>
<input type="radio" name="revenda" value="1">

<label for="combo">Combo</label>
<input type="radio" name="combo" value="1">

<label>Nome:</label>
<input type="text" name="nome" required>

<label>Categoria:</label>
<select name="categoria_id" required>
    <option value=""></option>
</select>

<label>Descrição:</label>
<textarea id="descricao" name="descricao" rows="5" cols="40" required></textarea>

<label>Preço:</label>
<input type="number" id="preco_venda" name="preco_venda" step="0.01" min="0" placeholder="0,00" required>

<label>Foto:</label>
<input type="file" name="imagemcaminho" required>

<label>Mostrar no Cardápio:</label>

<input type="radio" id="sim" name="mostrar_no_cardapio" value="1">
<label for="sim">Sim</label><br>


<button>Entrar</button>
</form>
</div>
</body>
</html>
