<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disco Burguer</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <header class="header">
    <div class="logo">DISCO<br><span>BURGUER</span></div>
    <nav class="nav">
      <a href="#inicio">Início</a>
      <a href="#cardapio">Cardápio</a>
      <a href="#novidades">Novidades</a>
      <a href="#quem-somos">Quem somos</a>
      <a href="#local">Local</a>
      <a href="#contato">Contato</a>
      <a href="#cadastro" class="btn-cadastro">Cadastro</a>
    </nav>
  </header>

  <section class="hero">
    <div class="sun"></div>
    <div class="grid-floor"></div>

    <div class="hero-content">
      <div class="hero-text">
        <h1>DISCO<br><span class="highlight">BURGUER</span></h1>
        <a href="#cardapio" class="btn-cardapio">VER CARDÁPIO &gt;</a>
      </div>
      <div class="hero-image">
        <img src="https://via.placeholder.com/400x350?text=Hamb%C3%Barguer" alt="Hambúrguer Disco Burguer" />
      </div>
    </div>
  </section>

  <section class="mais-pedidos">
    <h2><span>OS MAIS PEDIDOS</span></h2>

    <div class="cards-container">
      <div class="card card-rosa">
        <img src="https://via.placeholder.com/200x150?text=Burguer+1" alt="Hambúrguer 1" />
      </div>
      <div class="card card-azul">
        <img src="https://via.placeholder.com/200x150?text=Burguer+2" alt="Hambúrguer 2" />
      </div>
      <div class="card card-amarelo">
        <img src="https://via.placeholder.com/200x150?text=Burguer+3" alt="Hambúrguer 3" />
      </div>
    </div>
  </section>

</body>
</html>
